                      pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  required:
                    - fullName
                    - phone
                payload:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
                - idempotencyKey
                - client
      responses:
        "200":
          description: Дубликат (тот же idempotencyKey)
          content:
            application/json:
              schema:
                type: object
