        - webhooks
      summary: "Приём события от 1С/ИИ-ассистента. Идемпотентность: повтор ключа → DUPLICATE. Аутентификация: HMAC-подпись
        x-webhook-signature (SHA-256) ИЛИ x-webhook-token, ИЛИ валидный JWT (Webhook Console). Rate-limit: 60
        запросов/мин"
      operationId: post_webhooks_1c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  minLength: 1
                  maxLength: 64
                eventType:
                  type: string
                  minLength: 1
                  maxLength: 128
                payload: {}
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - eventType
                - payload
                - idempotencyKey
      security: []
      responses:
        "200":
          description: Дубликат или FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "202":
          description: Событие принято в обработку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "401":
          description: Неверная подпись/секрет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Превышен rate-limit
